name: Smoke Test

# Fast pre-flight build + make check across common-failure configs derived
# from the Jenkins PRB top-10 (last 30 days). Intentionally runs on drafts
# too: this is the gate that protects the rest of CI. Other PR workflows
# wait for this via .github/actions/wait-for-smoke.
#
# A single job checks out and autogens the source tree once, then configures
# and builds every config in its own out-of-tree ("VPATH") build directory
# and runs `make check` in all of them in parallel:
#   * read-only test data is symlinked into each build dir by the
#     wolfssl-test-data.stamp rule in Makefile.am.
#   * bubblewrap is installed so the script tests re-exec themselves under
#     bwrap --unshare-net and concurrent checks cannot collide on TCP/UDP
#     ports (do not set AM_BWRAPPED here - that would disable it).
#   * each build dir's certs symlink is replaced with a private copy because
#     scripts/crl-gen-openssl.test writes generated CRLs under certs/crl/.
# Builds go through ccache (cached across runs) to keep the single-runner
# job fast on warm caches.
#
# CFLAGS=-Werror is applied at make time only (not ./configure) so autoconf
# feature detection is not poisoned by benign warnings in conftest probes.
#
# For pull_request events the workflow tests the POST-MERGE tree:
# the PR head is checked out, the base branch is merged in, and:
#   * a merge conflict fails the job before any build runs.
#   * if the PR tree is identical to base (no diff), the build is skipped.
#   * otherwise the build runs against the merged tree.
# This catches stale PRs whose head builds clean but whose merge with
# current master would break.

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'AUTHORS'
      - 'LICENSING'
      - 'ChangeLog.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ master, main ]

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAKE_CFLAGS: "-Werror"
      CONFIGS_TSV: ${{ runner.temp }}/configs.tsv
      LOGS_DIR: ${{ runner.temp }}/smoke-logs
      CCACHE_MAXSIZE: 2G
    steps:
      # For PRs we explicitly check out the PR head (not the auto-merge
      # ref) and do the merge ourselves below so we can fail fast on
      # conflicts. For push events we just check out the pushed SHA.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Merge base into PR head (fail fast on conflict)
        id: merge_check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          git config user.email "ci@wolfssl.invalid"
          git config user.name "wolfSSL CI Merge"
          git fetch --no-tags origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          if git diff --quiet "$BASE_SHA" HEAD; then
            echo "::notice::PR tree is identical to $BASE_REF; skipping smoke matrix."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-ff --no-commit "$BASE_SHA"; then
            echo "::error::Merge conflicts with $BASE_REF - please rebase or merge $BASE_REF into the PR branch before testing."
            git merge --abort || true
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Clean merge with $BASE_REF; testing post-merge tree."

      - name: Install dependencies
        if: steps.merge_check.outputs.skip != 'true'
        uses: ./.github/actions/install-apt-deps
        with:
          packages: autoconf automake libtool build-essential bubblewrap ccache

      # Ubuntu 24.04 can restrict unprivileged user namespaces via AppArmor,
      # which would stop the test scripts from re-execing under
      # bwrap --unshare-net (their port-isolation mechanism).
      - name: Allow unprivileged user namespaces (for bwrap)
        if: steps.merge_check.outputs.skip != 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Restore ccache
        if: steps.merge_check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: smoke-ccache-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            smoke-ccache-${{ github.base_ref || github.ref_name }}-
            smoke-ccache-

      - name: Write config table
        if: steps.merge_check.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p "$LOGS_DIR"
          ccache -z
          # name <TAB> configure args <TAB> make CFLAGS override <TAB> make LDFLAGS
          # An empty CFLAGS field means the default $MAKE_CFLAGS (-Werror).
          # The leantls/dtls/integration entries target the top Jenkins PRB
          # failure modes (-Werror unused-function / implicit-decl / link
          # errors). AddressSanitizer entry excludes UBSAN - current master
          # has known left-shift UB in auto-generated SP math.
          printf '%s\t%s\t%s\t%s\n' \
            'default' '' '' '' \
            'enable-all' '--enable-all' '' '' \
            'opensslextra' '--enable-opensslextra' '' '' \
            'enable-all-smallstack' '--enable-all --enable-smallstack' '' '' \
            'cryptonly' '--enable-cryptonly' '' '' \
            'leantls-extra' '--enable-leantls --enable-session-ticket --enable-sni --enable-opensslextra' '' '' \
            'dtls-suite' '--enable-psk --enable-dtls --enable-dtls13 --enable-dtls-mtu --enable-aesccm --enable-opensslextra' '' '' \
            'integration' '--enable-openssh --enable-lighty --enable-stunnel --enable-opensslextra' '' '' \
            'sanitize-asan' '--enable-all' '-fsanitize=address -fno-omit-frame-pointer -g -O1' '-fsanitize=address' \
            > "$CONFIGS_TSV"

      - name: autogen
        if: steps.merge_check.outputs.skip != 'true'
        run: ./autogen.sh

      - name: configure (all configs, parallel)
        if: steps.merge_check.outputs.skip != 'true'
        run: |
          set -e
          pids=(); names=()
          while IFS=$'\t' read -r name args cflags ldflags; do
            mkdir "build-$name"
            ( cd "build-$name" && ../configure $args CC="ccache gcc" ) \
              > "$LOGS_DIR/$name.configure.log" 2>&1 &
            pids+=("$!"); names+=("$name")
          done < "$CONFIGS_TSV"
          failed=()
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then failed+=("${names[$i]}"); fi
          done
          for name in "${names[@]}"; do
            echo "::group::configure $name"
            cat "$LOGS_DIR/$name.configure.log"
            echo "::endgroup::"
          done
          for name in "${failed[@]}"; do
            echo "::group::config.log $name"
            cat "build-$name/config.log" || true
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::configure failed for: ${failed[*]}"
            exit 1
          fi

      - name: make (all configs, parallel)
        if: steps.merge_check.outputs.skip != 'true'
        run: |
          set -e
          pids=(); names=()
          while IFS=$'\t' read -r name args cflags ldflags; do
            FLAGS="${cflags:-$MAKE_CFLAGS}"
            # "check TESTS=" prebuilds the check programs (testsuite,
            # tests/unit.test, ...) without running any tests, so the check
            # step below is pure test execution.
            ( make -C "build-$name" -j2 CFLAGS="$FLAGS" LDFLAGS="$ldflags" && \
              make -C "build-$name" -j2 check TESTS= CFLAGS="$FLAGS" LDFLAGS="$ldflags" ) \
              > "$LOGS_DIR/$name.build.log" 2>&1 &
            pids+=("$!"); names+=("$name")
          done < "$CONFIGS_TSV"
          failed=()
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then failed+=("${names[$i]}"); fi
          done
          for name in "${names[@]}"; do
            echo "::group::make $name"
            cat "$LOGS_DIR/$name.build.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::make failed for: ${failed[*]}"
            exit 1
          fi

      # scripts/crl-gen-openssl.test writes generated CRLs under certs/crl/.
      # With the VPATH certs symlink that write would land in the shared
      # source tree and race between the parallel checks, so give every
      # build dir its own copy. The wolfssl-test-data.stamp already exists,
      # so make will not recreate the symlink.
      - name: Give each build dir a private certs copy
        if: steps.merge_check.outputs.skip != 'true'
        run: |
          set -e
          while IFS=$'\t' read -r name args cflags ldflags; do
            rm "build-$name/certs"
            cp -a certs "build-$name/certs"
          done < "$CONFIGS_TSV"

      - name: make check (all configs, parallel)
        if: steps.merge_check.outputs.skip != 'true'
        run: |
          set -e
          pids=(); names=()
          while IFS=$'\t' read -r name args cflags ldflags; do
            FLAGS="${cflags:-$MAKE_CFLAGS}"
            make -C "build-$name" check CFLAGS="$FLAGS" LDFLAGS="$ldflags" \
              > "$LOGS_DIR/$name.check.log" 2>&1 &
            pids+=("$!"); names+=("$name")
          done < "$CONFIGS_TSV"
          failed=()
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then failed+=("${names[$i]}"); fi
          done
          {
            echo "### Smoke make check"
            echo ""
            echo "| Config | Result |"
            echo "|---|---|"
            for name in "${names[@]}"; do
              result=":white_check_mark: pass"
              case " ${failed[*]} " in
                *" $name "*) result=":x: FAIL" ;;
              esac
              echo "| $name | $result |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for name in "${names[@]}"; do
            echo "::group::make check $name"
            cat "$LOGS_DIR/$name.check.log"
            echo "::endgroup::"
          done
          for name in "${failed[@]}"; do
            echo "::group::test-suite.log $name"
            cat "build-$name/test-suite.log" || true
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::make check failed for: ${failed[*]}"
            exit 1
          fi

      - name: ccache stats
        if: always() && steps.merge_check.outputs.skip != 'true'
        run: ccache -s || true

      - name: Upload logs on failure
        if: failure() && steps.merge_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            build-*/test-suite.log
            build-*/config.log
            ${{ runner.temp }}/smoke-logs/
          if-no-files-found: ignore
